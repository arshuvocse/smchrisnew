version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: smc_hris_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=sa1234
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    restart: always

